services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      MONGO_URI: mongodb://mongo:27017/cloudnas
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DATA_DIR: /data
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    volumes:
      - file_data:/data
volumes:
  mongo_data:
  file_data:
